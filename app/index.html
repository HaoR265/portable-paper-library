<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随身论文库</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="shell"><aside class="sidebar"><a class="brand" href="#"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 6h7v20H6zM17 6h7v20h-7zM8 11h3m8 0h3M8 21h3m8 0h3"/></svg><span>随身论文库<small>我的纸本与电子文献</small></span></a><nav aria-label="文献筛选"><button data-filter="all" class="active">全部论文<span id="allCount">—</span></button><button data-filter="unprinted">未打印<span id="unprintedCount">—</span></button><button data-filter="missing">待补电子版<span id="missingCount">—</span></button><button id="relationsBtn">待确认关系<span id="relationsCount">—</span></button></nav><div class="side-note"><span class="dot"></span>本地保存 · 离线可用<p>同一研究，放在一起。<br>每个版本，独立编号。</p></div><div class="side-actions"><button id="backupBtn">备份与恢复</button><a href="/api/export" download="论文库索引.json">导出索引</a><button id="quitBtn">退出系统</button></div></aside>
<main><header><div><h1 id="pageTitle">全部论文</h1><p id="summary">正在读取论文库…</p></div><button class="primary" id="addBtn"><span aria-hidden="true">＋</span> 收录论文</button></header><section class="search-area" aria-label="搜索论文"><form id="searchForm"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" type="search" aria-label="标题、关键词或编号" placeholder="搜索标题、中文 / 英文关键词，或编号" autocomplete="off"><button type="submit">搜索</button></form><p id="searchHelp">搜索到文件夹，再选择要打开的版本。试试 <button data-query="隐私推理">隐私推理</button>、<button data-query="格密码">格密码</button> 或 <button data-query="1">1</button></p></section><div id="workspace"><div class="list-heading"><span id="resultCount">论文文件夹</span><span>按入库编号排序</span></div><section id="results" aria-label="论文文件夹"><p class="empty">正在加载…</p></section></div><footer><span>编号保留入库顺序，版本共享研究文件夹</span><span id="rootLabel"></span></footer></main></div><div id="toast" role="status" aria-live="polite"></div><script src="/app.js"></script></body></html>
